plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.btcliveanalyzer'
version = '0.1.0'

android {
  namespace 'expo.modules.btcbackgroundanalysis'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core:1.13.1'
}